async function exp(kind){const tot=document.getElementById('tot');if(!seq.some(e=>e.p)){tot.textContent='ჯერ ჩაწერე ნოტები';return}try{const dl=(typeof claude!=='undefined'&&claude.use)?await claude.use('downloads'):null;const c=await toCanvas();const data=await new Promise(r=>c.toBlob(r,'image/png'));const fn='shakuhachi.'+kind;if(dl)await dl.save({filename:fn,data});else{const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=fn;document.body.appendChild(a);a.click();a.remove()}}catch(err){console.error(err)}}
const WH=[0,2,4,5,7,9,11],BL=[1,3,6,8,10],BC=[2,4,8,10,12];
function kb(){const f=(i,o,st,cl)=>{const n=NM[i],p=NK[i]+o,ok=!!N[p];let c;if(mode==='s')c=staff(p);else if(mode==='l')c=n+o+(SH[i]?`<small>${SH[i]}${o}</small>`:'');else{const g=G[N[p]]||['?',''];c=gl(g[0],g[1],'')}return `<button class="kb ${cl||''}" ${ok?'':'disabled'} data-p="${p}" ${st||''}>${c}</button>`};let h='';for(let o=4;o<=7;o++)h+=`<div class="oc"><div class="g b14">${BL.map((i,j)=>f(i,o,`style="grid-column:${BC[j]}/span 2"`,'bl')).join('')}</div><div class="g w7">${WH.map(i=>f(i,o)).join('')}</div></div>`;document.getElementById('pk').innerHTML=h;document.getElementById('md').textContent={s:'𝄞',l:'ABC',j:'字'}[mode]}
const fmtC=d=>{const c=d/2,w=Math.floor(c),f=c-w,fr=f===0?'':f===.25?'¼':f===.5?'½':f===.75?'¾':'';return w===0?(fr||String(c)):w+fr};const drl=()=>{document.getElementById('dr').innerHTML=fmtC(dur)+'<small>თვლა</small>'};const DPB=[0,0.5,1,1.5,2,3,4,5,6,8];let DPX=[];const dpVals=()=>[...new Set([...DPB,...DPX,dur])].sort((a,b)=>a-b);function refreshDP(){const p=document.getElementById('dpop');if(!p||p.hidden)return;const r=document.getElementById('dpr');r.innerHTML=dpVals().map(v=>`<button data-dv="${v}"${v===dur?' class="on"':''}>${fmtC(v)}</button>`).join('')}function openDP(){document.getElementById('dpop').hidden=false;refreshDP()}function addDP(){const m=Math.max(...dpVals());if(m<48)DPX.push(Math.min(48,m+2));refreshDP();const r=document.getElementById('dpr');r.scrollLeft=r.scrollWidth}function setDur(v,keep){dur=Math.max(0,Math.min(48,v));if(!keep){const k=DU.findIndex(x=>x[1]===dur);if(k>=0)di=k}drl();if(sel){for(let k=sel.a;k<=sel.b;k++)if(seq[k].p||seq[k].rs){seq[k].d=dur;delete seq[k].tr}}}
document.getElementById('pad').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const l=seq[cur-1];if(b.dataset.p){ins({p:b.dataset.p,d:dur});document.getElementById('dpop').hidden=true;render()}else if(b.id==='rg'){fmNext=!fmNext;render()}else if(b.id==='md'){mode=mode==='s'?'l':mode==='l'?'j':'s';kb()}else if(b.id==='dr'){const pp=document.getElementById('dpop');if(pp.hidden)openDP();else pp.hidden=true}else if(b.dataset.dv){setDur(+b.dataset.dv);document.getElementById('dpop').hidden=true}else if(b.id==='dpm'){addDP()}else if(b.id==='sp'){if(l&&l.hn){ins({rs:1,d:dur});render()}else if(l&&!l.br){ins({hn:1});render()}}else if(b.id==='en'){if(l&&!l.br){ins({br:1});render()}}else if(b.id==='un'){if(cur>0){seq.splice(cur-1,1);cur--;sel=null;render()}}else if(b.id==='sx2'){sel=null;render()}else if(b.id==='gm'){setCnt(-1)}else if(b.id==='trg'){toggleTri()}else if(b.id==='cpy'){copySel();render()}else if(b.id==='cut'){cutSel()}else if(b.id==='pst'){pasteSel()}else if(b.id==='gpl'){setCnt(1)}else if(b.id==='gx'){unG()}};
document.getElementById('cl').onclick=()=>{seq=[];cur=0;cname='';render()};document.getElementById('out').onclick=e=>{const r=e.target.closest('[data-i]');if(sel){if(r){const i=+r.dataset.i;sel.a=Math.min(sel.anc,i);sel.b=Math.max(sel.anc,i)}else sel=null}else if(r){sel={anc:+r.dataset.i,a:+r.dataset.i,b:+r.dataset.i};render()}};document.getElementById('ep').onclick=()=>exp('png');
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
let clip=LS.get('shk.clip');if(!Array.isArray(clip))clip=null;
function setCnt(dn){if(!sel)return;const ex=exactG();if(ex){const f=gr(ex)[0];const gc=seq[f].gc=seq[f].gc||{};gc[ex]=Math.max(2,(gc[ex]||2)+dn)}else{const a=sel.a,b=sel.b,ids=new Set();for(let k=a;k<=b;k++)(seq[k].g||[]).forEach(x=>ids.add(x));for(const x of ids){const[f,l]=gr(x);if(!((f>=a&&l<=b)||(f<=a&&l>=b))){document.getElementById('gv').textContent='⚠';return}}const id=1+Math.max(0,...seq.flatMap(e=>e.g||[])),pos=(seq[a].g||[]).filter(x=>(seq[b].g||[]).includes(x)).length;for(let k=a;k<=b;k++){const g=(seq[k].g=seq[k].g||[]);g.splice(Math.min(pos,g.length),0,id)}seq[a].gc=Object.assign(seq[a].gc||{},{[id]:2})}render()}
function unG(){if(!sel)return;const t=exactG()||innerG();if(!t)return;seq.forEach(e=>{if(e.g){e.g=e.g.filter(x=>x!==t);if(!e.g.length)delete e.g}if(e.gc&&e.gc[t]!==undefined){delete e.gc[t];if(!Object.keys(e.gc||{}).length)delete e.gc}});render()}
function toggleTri(){if(!sel)return;const ks=[];for(let k=sel.a;k<=sel.b;k++)if(seq[k].p||seq[k].rs)ks.push(k);if(!ks.length)return;const all=ks.every(k=>seq[k].tr);ks.forEach(k=>{if(all)delete seq[k].tr;else seq[k].tr=1});render()}
function copySel(){if(!sel)return;const a=sel.a,b=sel.b,keep=new Set();const ids=new Set();for(let k=a;k<=b;k++)(seq[k].g||[]).forEach(x=>ids.add(x));ids.forEach(x=>{const[f,l]=gr(x);if(f>=a&&l<=b)keep.add(x)});clip=seq.slice(a,b+1).map(e=>{const o=JSON.parse(JSON.stringify(e));if(o.g){o.g=o.g.filter(x=>keep.has(x));if(!o.g.length)delete o.g}if(o.gc){for(const id in o.gc)if(!keep.has(+id))delete o.gc[id];if(!Object.keys(o.gc||{}).length)delete o.gc}return o});LS.set('shk.clip',clip)}
function cutSel(){if(!sel)return;copySel();const a=sel.a;seq.splice(a,sel.b-a+1);cur=a;sel=null;render()}
function pasteSel(){if(!clip||!clip.length)return;const pos=sel?sel.b+1:cur;seq.splice(pos,0,...JSON.parse(JSON.stringify(clip)));cur=pos+clip.length;sel=null;render()}
const gr=id=>{let f=-1,l=-1;seq.forEach((e,i)=>{if(e.g&&e.g.includes(id)){if(f<0)f=i;l=i}});return[f,l]};
const exactG=()=>{if(!sel)return 0;for(const id of (seq[sel.a].g||[])){const[f,l]=gr(id);if(f===sel.a&&l===sel.b)return id}return 0};
const innerG=()=>{if(!sel)return 0;const gb=seq[sel.b].g||[];let r=0;for(const id of (seq[sel.a].g||[]))if(gb.includes(id))r=id;return r};
kb();drl();render();
</script></body></html>
