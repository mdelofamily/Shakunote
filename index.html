<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#161616">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>尺八 ნოტების რვეული</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div class="row"><span class="m" id="tot" style="flex:1"></span><button id="undo" style="flex:0 0 auto;padding:3px 9px;font-size:16px" title="Undo">⟲</button><button id="ep" style="flex:0 0 auto;padding:3px 9px">⤓ PNG</button><button id="sb" style="flex:0 0 auto;padding:3px 9px">💾</button><button id="cl" style="flex:0 0 auto;padding:3px 9px">✕</button></div>
  <div id="out"></div>
  <div id="pad">
    <div id="selp" class="row" hidden>
      <button id="mark_none" title="ცარიელი">▢</button>
      <button id="mark_left" title="ურა (მარცხნივ)">•|</button>
      <button id="mark_right" title="ომოტე (მარჯვნივ)">|•</button>
      <button id="mark_tri" title="3/4 სამკუთხედი">△</button>
      <button id="gm">−</button>
      <b id="gv" style="flex:1;text-align:center;font-size:16px">×</b>
      <button id="gpl">+</button>
      <button id="cpy" title="Copy"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>
      <button id="cut" title="Cut">✂</button>
      <button id="brush" title="Format Painter">🖌️</button>
      <button id="pst">⎘</button>
      <button id="sx2">✓</button>
    </div>
    <div id="pk"></div>
    <div class="row"><button id="md" style="flex:1"></button><button id="rg" style="flex:1;font-size:18px"></button><button id="sp" style="flex:4;font-size:26px;line-height:1">␣</button><button id="en" style="flex:1;font-size:36px;line-height:1">↵</button><button id="un" style="flex:1;font-size:22px;line-height:1">⌫</button></div>
  </div>
</div>
<div id="sv" hidden><div class="row" style="margin-bottom:8px"><b style="flex:1">💾 კომპოზიციები</b><button id="sx" style="flex:0 0 auto;padding:4px 12px">✕</button></div>
<div class="m" style="margin-bottom:6px">მიმდინარე ჩანაწერი ავტომატურად ინახება ამ ბრაუზერში. სახელით შესანახად:</div>
<div class="row"><input type="text" id="sn" placeholder="სახელი"><button id="ss" style="flex:0 0 auto;padding:7px 12px">შენახვა</button></div>
<div id="sl" style="margin:8px 0"></div>
<div class="row" style="flex-wrap:wrap"><button id="snw">ახალი</button><button id="sbk">დაბრუნება</button><button id="sje">⤓ JSON</button><button id="sji">⤒ იმპორტი</button></div>
<input type="file" id="sf" accept=".json,application/json" hidden><div class="m" id="svm" style="margin-top:8px"></div></div>
<script defer src="js/data.js"></script>
<script defer src="js/storage.js"></script>
<script defer src="js/history.js"></script>
<script defer src="js/render.js"></script>
<script defer src="js/keyboard.js"></script>
<script defer src="js/app.js"></script>
<script defer src="js/swipe.js"></script>
</body></html>
