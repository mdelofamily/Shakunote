</style></head><body><div class="row"><span class="m" id="tot" style="flex:1"></span><button id="ep" style="flex:0 0 auto;padding:3px 9px">⤓ PNG</button><button id="sb" style="flex:0 0 auto;padding:3px 9px">💾</button><button id="cl" style="flex:0 0 auto;padding:3px 9px">✕</button></div>

<div class="m" style="margin-bottom:6px">მიმდინარე ჩანაწერი ავტომატურად ინახება ამ ბრაუზერში. სახელით შესანახად:</div>

<input type="file" id="sf" accept=".json,application/json" hidden><div class="m" id="svm" style="margin-top:8px"></div></div>
<script>
const N={C4:1,Db4:2,D4:3,Eb4:5,E4:6,F4:7,Gb4:9,G4:10,Ab4:12,A4:16,Bb4:19,B4:21,C5:23,Db5:26,D5:30,Eb5:34,E5:37,F5:39,Gb5:41,G5:43,Ab5:45,A5:49,Bb5:52,B5:56,C6:60,Db6:63,D6:66,Eb6:69,E6:72,F6:75,Gb6:76,G6:77,Ab6:78,A6:79,Bb6:80,B6:81,C7:82,D7:83};
const G={1:['ロ','D'],2:['ロ','M'],3:['ロ',''],5:['ツ','M'],6:['ツ','C'],7:['ツ',''],9:['レ','M'],10:['レ',''],12:['ウ',''],16:['チ',''],19:['リ','M'],21:['リ','C'],23:['リ',''],26:['ヒ','M五'],30:['ロ',''],34:['ツ','M'],37:['ツ','C'],39:['ツ',''],41:['レ','M'],43:['レ',''],45:['チ','M'],49:['チ',''],52:['ヒ','M'],56:['ヒ','C'],60:['ヒ',''],63:['ヒ','M五'],66:['ハ','五'],69:['ハ','三'],72:['ハ','四'],75:['ツ','K'],77:['レ','K'],78:['チ','MK'],79:['チ','K'],80:['ヒ','MK'],81:['ヒ','CK'],82:['ヒ','K'],83:['ハ','K']};
const B={ロ:'M6 9L33 7L31 33L8 32Z',ツ:'M6 10L12 18M14 9H31Q36 12 33 24Q28 34 16 38',レ:'M11 6L12 30Q26 30 36 18',チ:'M12 7L30 9M5 18H35M21 9Q23 28 12 37',リ:'M12 8V22M27 6V26Q25 34 15 38',ヒ:'M12 6V30Q14 34 34 32M12 18H30',ウ:'M20 3V9M9 14V22M9 14H29Q35 16 32 26Q27 35 15 38',ハ:'M17 8L6 34M24 10Q35 16 33 30','＞':'M8 6L32 20L10 32','?':'M10 12Q20 2 30 12Q30 20 20 24V28M20 34V36'};
const NM=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'],NK=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'],SH=['','C♯','','D♯','','','F♯','','G♯','','A♯',''];
const DU=[['½',1],['1',2],['1½',3],['2',4],['3',6],['4',8]];
let seq=[],cur=0,dur=2,mode='s',di=1,lay=[],EW=0,EH=0;
const me=(x,y)=>`<path d="M0 0L8 12M8 0L1 13" transform="translate(${x},${y})" class="mk"/>`;
const Y0=(m,reg)=>(m.includes('K')||reg)?2:14,GH=(m,reg)=>(66-Y0(m,reg))*.55;
function gl(b,m,reg){let s='';
 if(m.includes('D'))s+='<text x="2" y="30" class="tx">大</text>'+me(3,34);else if(m.includes('M'))s+=me(3,34);
 if(m.includes('C'))s+='<text x="1" y="42" class="tx">中</text>';
 if(m.includes('K'))s+='<text x="26" y="10" class="tx">大</text><text x="26" y="21" class="tx">甲</text>';
 const n=[...m].filter(c=>'二三四五'.includes(c));
 if(n.length>1)n.forEach((c,i)=>s+=`<text x="1" y="${26+i*11}" class="tx">${c}</text>`);else if(n.length)s+=b==='ハ'?`<text x="22" y="56" class="tx">${n[0]}</text>`:`<text x="40" y="30" class="tx">${n[0]}</text>`;
 if(reg)s+=`<text x="48" y="14" class="tx">${reg}</text>`;
 const y0=Y0(m,reg);return `<svg width="35" height="${GH(m,reg)}" viewBox="0 ${y0} 64 ${66-y0}">${b==='＞'?`<g transform="translate(18,24) translate(20,19) scale(.6) translate(-20,-19)" class="gl" style="stroke-width:7.5"><path d="${B[b]}"/></g>`:`<g transform="translate(18,24)" class="gl"><path d="${B[b]}"/></g>`}${s}</svg>`}
const pv=p=>{const o=+p.slice(-1),k=NK.indexOf(p.slice(0,-1));return o*12+k};
function staff(p){const o=+p.slice(-1),L=p[0],ac=p[1]==='b',ix=o*7+'CDEFGAB'.indexOf(L)-30,hs=3,bt=60,y=bt-ix*hs;let q='';for(let k=0;k<5;k++)q+=`<line x1="4" x2="46" y1="${bt-k*2*hs}" y2="${bt-k*2*hs}" class="sl"/>`;
 if(ix<0)for(let e=-2;e>=ix;e-=2)q+=`<line x1="19" x2="33" y1="${bt-e*hs}" y2="${bt-e*hs}" class="sl"/>`;
 if(ix>8)for(let e=10;e<=ix;e+=2)q+=`<line x1="19" x2="33" y1="${bt-e*hs}" y2="${bt-e*hs}" class="sl"/>`;
 q+=`<ellipse cx="26" cy="${y}" rx="5" ry="3.6" class="sn"/>`+(ac?`<text x="10" y="${y+5}" class="sa">♭</text>`:'');
 const y0=Math.min(y-9,bt-8*hs-4),y1=Math.max(bt+4,y+9);return `<svg viewBox="0 ${y0} 50 ${y1-y0}">${q}</svg>`}
function render(){let t=0,reg=null,prev=null;const cols=[[]];if(cur<0||cur>seq.length)cur=seq.length;
 const mk0=()=>cols[cols.length-1].push({cu:1});if(cur===0)mk0();
 seq.forEach((e,i)=>{if(e.br){cols.push([]);if(cur===i+1)mk0();return}const c=cols[cols.length-1];if(e.hn){c.push({hn:1,i});if(cur===i+1)mk0();return}
  const side=t%2===0?'R':'L',nd=Math.ceil(e.d/2),rep=prev&&prev.p===e.p;
  const [b,m]=G[N[e.p]]||['?',''];const kan=pv(e.p)>60;const R=kan?'甲':'乙';let mk='';
  if(!rep){if(reg===null||R!==reg){const auto=prev&&G[N[prev.p]]&&G[N[prev.p]][0]==='リ'&&kan&&(b==='ロ'||b==='ツ');if(!auto)mk=R;reg=R}}
  const line=e.d===1&&((seq[i-1]&&seq[i-1].d===1)||(seq[i+1]&&seq[i+1].d===1));
  c.push({b:rep?'＞':b,m:rep?'':m,mk,side,nd,line,i});t+=e.d;prev=e;if(cur===i+1)mk0()});
 lay=cols.map(c=>c.filter(x=>!x.cu));
 const dots=n=>'<div class="dt"></div>'.repeat(n);
 document.getElementById('out').innerHTML=cols.map(c=>`<div class="col">${c.map(it=>it.cu?'<div class="cu"></div>':it.hn?`<div class="bh" data-i="${it.i}"></div>`:`<div class="r" data-i="${it.i}">${it.line?'<div class="ln"></div>':''}<div class="s">${it.side==='L'?dots(it.nd):''}</div>${gl(it.b,it.m,it.mk)}<div class="s">${it.side==='R'?dots(it.nd):''}</div></div>`).join('')}</div>`).join('');
 const cu=document.querySelector('#out .cu');if(cu)cu.scrollIntoView({block:'nearest',inline:'nearest'});
 document.getElementById('tot').textContent=seq.length?`სულ ${t/2} თვლა`:'';LS.set('shk.cur',seq)}
function exportSvg(){const cw=64,pd=18;const W=lay.length*cw+pd*2;let H=0,out='';
 lay.forEach((col,ci)=>{const cx=W-pd-cw/2-ci*cw;let y=pd;col.forEach(it=>{
  if(it.hn){out+=`<line x1="${cx-23}" x2="${cx-8}" y1="${y+6}" y2="${y+6}" class="ex"/>`;y+=12;return}
  const h=GH(it.m,it.mk),rh=h+4;
  if(it.line)out+=`<line x1="${cx}" x2="${cx}" y1="${y}" y2="${y+rh}" class="ex" style="stroke-width:1.2"/>`;
  out+=gl(it.b,it.m,it.mk).replace('<svg ',`<svg x="${cx-17.5}" y="${y+2}" `);
  for(let j=0;j<it.nd;j++){out+=`<circle cx="${it.side==='R'?cx+26:cx-26}" cy="${y+rh/2+(j-(it.nd-1)/2)*8}" r="2.6" fill="#000"/>`}
  y+=rh});H=Math.max(H,y)});
 EW=W;EH=H+pd;return `<svg xmlns="http://www.w3.org/2000/svg" width="${EW}" height="${EH}" viewBox="0 0 ${EW} ${EH}"><style>.gl{fill:none;stroke:#000;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.mk{fill:none;stroke:#000;stroke-width:2.4;stroke-linecap:round}.tx{fill:#000;font:13px "Noto Serif CJK JP","Hiragino Mincho ProN","Yu Mincho",serif}.ex{stroke:#000;stroke-width:1.5}</style><rect width="100%" height="100%" fill="#fff"/>${out}</svg>`}
const SC=3;function toCanvas(){return new Promise((res,rej)=>{const svg=exportSvg(),img=new Image(),u=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
 img.onload=()=>{const c=document.createElement('canvas');c.width=EW*SC;c.height=EH*SC;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c)};img.onerror=rej;img.src=u})}
async function exp(kind){const tot=document.getElementById('tot');if(!seq.some(e=>e.p)){tot.textContent='ჯერ ჩაწერე ნოტები';return}
 try{const dl=(typeof claude!=='undefined'&&claude.use)?await claude.use('downloads'):null;
  const c=await toCanvas();const data=await new Promise(r=>c.toBlob(r,'image/png'));
  const fn='shakuhachi.'+kind;if(dl)await dl.save({filename:fn,data});else{const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=fn;document.body.appendChild(a);a.click();a.remove()}tot.textContent='შენახულია'}catch(e){tot.textContent=e&&e.code==='declined'?'':'ექსპორტი ვერ მოხერხდა: '+((e&&(e.code||e.message))||e)}}
const WH=[0,2,4,5,7,9,11],BL=[1,3,6,8,10],BC=[2,4,8,10,12];
function kb(){const f=(i,o,st,cl)=>{const n=NM[i],p=NK[i]+o,ok=!!N[p];let c;
 if(mode==='s')c=staff(p);else if(mode==='l')c=n+o+(SH[i]?`<small>${SH[i]}${o}</small>`:'');else{const g=G[N[p]]||['?',''];c=gl(g[0],g[1],'')}
 return `<button class="kb ${cl||''}" ${ok?'':'disabled'} data-p="${p}" ${st||''}>${c}</button>`};
 let h='';for(let o=4;o<=7;o++)h+=`<div class="oc"><div class="g b14">${BL.map((i,j)=>f(i,o,`style="grid-column:${BC[j]}/span 2"`,'bl')).join('')}</div><div class="g w7">${WH.map(i=>f(i,o)).join('')}</div></div>`;
 document.getElementById('pk').innerHTML=h;document.getElementById('md').textContent={s:'𝄞',l:'ABC',j:'字'}[mode]}
const drl=()=>{document.getElementById('dr').innerHTML=DU[di][0]+'<small>თვლა</small>'};
document.getElementById('pad').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const l=seq[cur-1];
 if(b.dataset.p){seq.splice(cur,0,{p:b.dataset.p,d:dur});cur++;render()}
 else if(b.id==='md'){mode=mode==='s'?'l':mode==='l'?'j':'s';kb()}
 else if(b.id==='dr'){di=(di+1)%DU.length;dur=DU[di][1];drl()}
 else if(b.id==='sp'){if(l&&!l.br&&!l.hn){seq.splice(cur,0,{hn:1});cur++;render()}}
 else if(b.id==='en'){if(l&&!l.br){seq.splice(cur,0,{br:1});cur++;render()}}
 else if(b.id==='un'){if(cur>0){seq.splice(cur-1,1);cur--;render()}}};
document.getElementById('cl').onclick=()=>{setBak();seq=[];cur=0;render()};
document.getElementById('out').onclick=e=>{const r=e.target.closest('[data-i]');if(r){const i=+r.dataset.i,bb=r.getBoundingClientRect();cur=(e.clientY-bb.top<bb.height/2)?i:i+1}else cur=seq.length;render()};

document.getElementById('ep').onclick=()=>exp('png');

const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const clean=a=>Array.isArray(a)?a.filter(e=>e&&(e.br||e.hn||(N[e.p]&&e.d>0))).map(e=>e.br?{br:1}:e.hn?{hn:1}:{p:e.p,d:e.d}):[];
const $=id=>document.getElementById(id);let delArm=null;
function setBak(){if(seq.length)LS.set('shk.bak',seq)}
function sv(m){$('svm').textContent=m||''}
function list(){const l=LS.get('shk.lib')||{},box=$('sl');box.innerHTML='';const ks=Object.keys(l).sort((a,b)=>l[b].t-l[a].t);
 if(!ks.length){box.innerHTML='<div class="m">შენახული კომპოზიციები ჯერ არ არის</div>';return}
 ks.forEach(k=>{const r=document.createElement('div');r.className='li';const sp=document.createElement('span');sp.textContent=k+' · '+new Date(l[k].t).toLocaleDateString();
  const o=document.createElement('button');o.textContent='გახსნა';o.onclick=()=>{setBak();seq=clean(l[k].seq);cur=seq.length;$('sn').value=k;render();$('sv').hidden=true};
  const x=document.createElement('button');x.textContent=delArm===k?'წაშლა?':'✕';x.onclick=()=>{if(delArm===k){delete l[k];LS.set('shk.lib',l);delArm=null}else delArm=k;list()};
  r.append(sp,o,x);box.append(r)})}
async function saveFile(fn,data){const dl=(typeof claude!=='undefined'&&claude.use)?await claude.use('downloads'):null;
 if(dl)await dl.save({filename:fn,data});else{const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=fn;document.body.appendChild(a);a.click();a.remove()}}
$('sb').onclick=()=>{list();sv('');$('sv').hidden=false};$('sx').onclick=()=>{$('sv').hidden=true;delArm=null};
$('ss').onclick=()=>{if(!seq.length){sv('ჯერ ჩაწერე ნოტები');return}const l=LS.get('shk.lib')||{};let n=$('sn').value.trim()||('კომპოზიცია '+(Object.keys(l).length+1));l[n]={t:Date.now(),seq:clean(seq)};
 sv(LS.set('shk.lib',l)?'შენახულია: '+n:'შენახვა ვერ მოხერხდა (ბრაუზერის მეხსიერება დაბლოკილია)');$('sn').value=n;list()};
$('snw').onclick=()=>{setBak();seq=[];cur=0;$('sn').value='';render();sv('ახალი ჩანაწერი. წინა ინახება: „დაბრუნება"')};
$('sbk').onclick=()=>{const b=LS.get('shk.bak');if(!b||!b.length){sv('დასაბრუნებელი არაფერია');return}const cs=seq;seq=clean(b);cur=seq.length;LS.set('shk.bak',cs);render();$('sv').hidden=true};
$('sje').onclick=async()=>{if(!seq.length){sv('ჯერ ჩაწერე ნოტები');return}try{await saveFile('shakuhachi-composition.json',new Blob([JSON.stringify({v:1,name:$('sn').value,seq:clean(seq)})],{type:'application/json'}));sv('ფაილი შენახულია')}catch(e){sv(e&&e.code==='declined'?'':'JSON ვერ შეინახა: '+((e&&(e.code||e.message))||e))}};
$('sji').onclick=()=>$('sf').click();
$('sf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result),q=clean(o.seq);if(!q.length)throw 0;setBak();seq=q;cur=seq.length;if(o.name)$('sn').value=o.name;render();$('sv').hidden=true}catch(x){sv('ფაილი ვერ წავიკითხე')}};r.readAsText(f);e.target.value=''};
